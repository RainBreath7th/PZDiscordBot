# Topology: PZ dedicated server is already a Docker container on THIS host.
#
#   docker compose -f compose.bot.yaml up -d
#
# The bot joins the existing PZ compose network. RCON stays inside that
# network — do not publish it to the host or the public internet.
#
# Required in .env:
#   DISCORD_TOKEN, RCON_HOST, RCON_PORT, RCON_PASSWORD, BOT_NETWORK
#
# RCON_HOST  = the PZ compose *service name* (e.g. pz-server), never localhost
# BOT_NETWORK = `docker inspect <pz-container> --format '{{json .NetworkSettings.Networks}}'`
#
# Other topologies:
#   compose.bot.remote.yaml  — PZ container lives on a different machine
#   compose.bot.native.yaml  — PZ is a bare-metal / non-Docker process
#
# This file does not start a game server and does not mount docker.sock.

services:
  pz-bot:
    image: rainbreath/pz-discord-bot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      RCON_HOST: ${RCON_HOST:?RCON_HOST is required}
      RCON_PORT: ${RCON_PORT:?RCON_PORT is required}
      RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD is required}
      POLL_INTERVAL: ${POLL_INTERVAL:-30}
      RESTART_TIMEOUT: ${RESTART_TIMEOUT:-7200}
      RESTART_GRACE: ${RESTART_GRACE:-360}
      RCON_FAIL_THRESHOLD: ${RCON_FAIL_THRESHOLD:-3}
      EMPTY_CONFIRM_SECONDS: ${EMPTY_CONFIRM_SECONDS:-10}
      RCON_TIMEOUT: ${RCON_TIMEOUT:-10}
      CONFIG_DIR: /app/config
      HEALTH_STATE_PATH: /tmp/pz-bot-health.json
    volumes:
      - ./config:/app/config
    networks:
      pz-net: {}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-m", "bot.health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 360s

networks:
  pz-net:
    external: true
    name: ${BOT_NETWORK:?BOT_NETWORK is required}
